[env:tbeam_lx6_det]
; Same pinned pioarduino release as the ESP32_C6 / HELTEC_V3 targets.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
; Generic devkit definition — correct for any ESP32-D0WDQ6 board; this test
; uses only UART0 and the CPU, no board-specific pins.
board = esp32dev
framework = arduino
; Classic ESP32 has no native USB: Serial is UART0 through the CH9102
; bridge (1A86:55D4) by default, so no CDC flag is needed.
; -fwrapv matches the repo Makefile; FP_DET_NO_MAIN drops fp_determinism.c's
; stdio main — src/main.cpp calls fp_det_compute() directly.
build_flags = -O2 -fwrapv -DFP_DET_NO_MAIN -DHW_TEST_TARGET=\"tbeam-lx6-det\"
monitor_speed = 115200
