[env:esp32c6_det]
; The registry espressif32 platform's Arduino core (2.x) has no ESP32-C6
; support; the maintained pioarduino fork ships Arduino core 3.x which does.
; Same pinned release artifact as the astro-nav-int ESP32_C6 target.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
; ARDUINO_USB_CDC_ON_BOOT=0 pins Serial to UART0 (the CH343 bridge port,
; 1A86:55D3) — the C6's native USB-Serial/JTAG CDC drops output without the
; right DTR state and opening it can knock the chip into download mode.
; Capture on the CH343 port, not 303A:1001.
; -fwrapv matches the repo Makefile; FP_DET_NO_MAIN drops fp_determinism.c's
; stdio main — src/main.cpp calls fp_det_compute() directly.
build_flags = -O2 -fwrapv -DFP_DET_NO_MAIN -DHW_TEST_TARGET=\"esp32-c6-det\" -DARDUINO_USB_CDC_ON_BOOT=0
monitor_speed = 115200
