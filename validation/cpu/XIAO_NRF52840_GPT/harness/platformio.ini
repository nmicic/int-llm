[env:xiao_nrf52840_gpt]
; Registry nordicnrf52 platform lacks this board; maxgerhardt fork pinned
; to the same commit as astro-nav-int's XIAO_NRF52840_SENSE harness.
; Adafruit nRF52 core (Seeed variant). -DUSE_TINYUSB is required: the
; core's USB CDC lives in TinyUSB and linking fails with `undefined
; reference to 'Serial'` without it (main.cpp guards the include).
platform = https://github.com/maxgerhardt/platform-nordicnrf52.git#cac6fcf943a41accd2aeb4f3659ae297a73f422e
board = xiaoble_adafruit
framework = arduino
; MGPT_NO_TRAIN  — inference-only: no dataset array, no gradients, no Adam.
; MGPT_NO_MAIN   — drop microgpt_int.c's main; src/main.cpp drives the
;                  model via mgpt_load_mem() + mgpt_generate_sample().
; The .mgw weight image is baked into flash rodata by prepare.sh
; (model_mgw.h) and read in place (XIP) — the weights never occupy RAM.
build_flags = -O2 -fwrapv -Wno-unused-function -DMGPT_NO_TRAIN -DMGPT_NO_MAIN -DHW_TEST_TARGET=\"xiao-nrf52840-gpt\" -DUSE_TINYUSB
monitor_speed = 115200
