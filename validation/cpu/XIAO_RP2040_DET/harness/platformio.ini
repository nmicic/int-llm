[env:xiao_rp2040_det]
; Same pinned maxgerhardt platform commit (arduino-pico core) as the
; astro-nav-int RP2040 targets.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#aa70b802be8851668053d4f09734e4089fe41932
board = seeed_xiao_rp2040
framework = arduino
; -fwrapv matches the repo Makefile: signed overflow must be defined
; two's-complement wraparound for the hash to be meaningful.
; FP_DET_NO_MAIN drops fp_determinism.c's stdio main; the wrapper in
; src/main.cpp calls fp_det_compute() directly.
build_flags = -O2 -fwrapv -DFP_DET_NO_MAIN -DHW_TEST_TARGET=\"xiao-rp2040-det\"
monitor_speed = 115200
