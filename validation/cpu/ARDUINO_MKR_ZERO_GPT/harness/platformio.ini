[env:mkrzero_gpt]
; Registry Atmel/Microchip SAM platform, pinned.
; Arduino MKR Zero, SAMD21G18A: Cortex-M0+ @ 48 MHz, 256 KB flash /
; 32 KB SRAM, no FPU. The smallest-flash GPT target: firmware code plus
; the whole 115 KB .mgw weight image must fit the 256 KB part (minus the
; 8 KB bootloader) — the literal "fits a 256 KB-flash MCU" check.
platform = atmelsam @ 8.3.0
board = mkrzero
framework = arduino
; -fwrapv matches the repo Makefile (defined signed wraparound).
; MGPT_NO_TRAIN  — inference-only: no dataset array, no gradients, no Adam.
; MGPT_NO_MAIN   — drop microgpt_int.c's main; src/main.cpp drives the
;                  model via mgpt_load_mem() + mgpt_generate_sample().
; The .mgw weight image is baked into flash by prepare.sh (model_mgw.h)
; and read in place from the SAMD21's memory-mapped internal flash — the
; weights never occupy RAM.
build_flags = -O2 -fwrapv -Wno-unused-function -DMGPT_NO_TRAIN -DMGPT_NO_MAIN -DHW_TEST_TARGET=\"mkrzero-samd21-gpt\"
monitor_speed = 115200
