[env:xiao_nrf52840_det]
; Registry nordicnrf52 platform lacks this board; maxgerhardt fork pinned
; to the same commit as astro-nav-int's XIAO_NRF52840_SENSE harness.
; Adafruit nRF52 core (Seeed variant). -DUSE_TINYUSB is required: the
; core's USB CDC lives in TinyUSB and linking fails with `undefined
; reference to 'Serial'` without it (main.cpp guards the include).
platform = https://github.com/maxgerhardt/platform-nordicnrf52.git#cac6fcf943a41accd2aeb4f3659ae297a73f422e
board = xiaoble_adafruit
framework = arduino
; -fwrapv matches the repo Makefile; FP_DET_NO_MAIN drops fp_determinism.c's
; stdio main — src/main.cpp calls fp_det_compute() directly.
build_flags = -O2 -fwrapv -DFP_DET_NO_MAIN -DHW_TEST_TARGET=\"xiao-nrf52840-det\" -DUSE_TINYUSB
monitor_speed = 115200
