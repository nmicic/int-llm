[env:pico2_riscv_det]
; Same physical board as PICO2_ARM_DET, switched to the RP2350's Hazard3
; RISC-V execution mode via board_build.mcu. Same pinned platform commit.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#aa70b802be8851668053d4f09734e4089fe41932
board = rpipico2
board_build.mcu = rp2350-riscv
framework = arduino
; -fwrapv matches the repo Makefile; FP_DET_NO_MAIN drops fp_determinism.c's
; stdio main — src/main.cpp calls fp_det_compute() directly.
build_flags = -O2 -fwrapv -DFP_DET_NO_MAIN -DHW_TEST_TARGET=\"pico2-riscv-det\"
monitor_speed = 115200
