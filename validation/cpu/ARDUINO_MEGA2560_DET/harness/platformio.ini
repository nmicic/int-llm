[env:mega2560_det]
; Arduino Mega 2560, ATmega2560: classic 8-bit AVR @ 16 MHz, 256 KB flash /
; 8 KB SRAM, Harvard architecture. The oldest and smallest-RAM target: the
; determinism grid cannot exist in RAM at all here (34 KB grid vs 8 KB SRAM),
; so FP_DET_EXTERNAL_GRID + the avr-gcc __flash address space keep it in
; program memory, read via LPM.
platform = atmelavr @ 5.3.0
board = megaatmega2560
framework = arduino
; -fwrapv matches the repo Makefile: signed overflow must be defined
; two's-complement wraparound for the hash to be meaningful.
; FP_DET_NO_MAIN drops fp_determinism.c's stdio main; the wrapper in
; src/main.cpp calls fp_det_compute() directly.
build_flags = -O2 -fwrapv -DFP_DET_NO_MAIN -DFP_DET_EXTERNAL_GRID -DHW_TEST_TARGET=\"mega2560-avr-det\"
monitor_speed = 115200
