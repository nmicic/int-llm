[env:tbeam_lx6_gpt]
; Same pinned pioarduino release as the ESP32_C6 / HELTEC_V3 targets.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
; Generic devkit definition — correct for any ESP32-D0WDQ6 board; this test
; uses only UART0 and the CPU, no board-specific pins.
board = esp32dev
framework = arduino
; Classic ESP32 has no native USB: Serial is UART0 through the CH9102
; bridge (1A86:55D4) by default, so no CDC flag is needed.
; MGPT_NO_TRAIN  — inference-only: no dataset array, no gradients, no Adam.
; MGPT_NO_MAIN   — drop microgpt_int.c's main; src/main.cpp drives the
;                  model via mgpt_load_mem() + mgpt_generate_sample().
; The .mgw weight image is baked into flash-mapped rodata by prepare.sh
; (model_mgw.h) and read zero-copy — the weights never occupy RAM.
build_flags = -O2 -fwrapv -Wno-unused-function -DMGPT_NO_TRAIN -DMGPT_NO_MAIN -DHW_TEST_TARGET=\"tbeam-lx6-gpt\"
monitor_speed = 115200
