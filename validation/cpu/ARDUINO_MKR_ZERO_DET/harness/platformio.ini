[env:mkrzero_det]
; Registry Atmel/Microchip SAM platform, pinned.
; Arduino MKR Zero, SAMD21G18A: Cortex-M0+ @ 48 MHz, 256 KB flash /
; 32 KB SRAM, no FPU — same core class as the XIAO RP2040 but from a
; different silicon vendor (Microchip) with a different Arduino core
; and internal (not QSPI/XIP) memory-mapped flash.
platform = atmelsam @ 8.3.0
board = mkrzero
framework = arduino
; -fwrapv matches the repo Makefile: signed overflow must be defined
; two's-complement wraparound for the hash to be meaningful.
; FP_DET_NO_MAIN drops fp_determinism.c's stdio main; the wrapper in
; src/main.cpp calls fp_det_compute() directly.
; FP_DET_EXTERNAL_GRID reads the input grid from a prepare-time generated
; const table in flash (include/fp_det_grid.h) instead of a RAM array —
; the ~34 KB grid does not fit the SAMD21's 32 KB SRAM.
build_flags = -O2 -fwrapv -DFP_DET_NO_MAIN -DFP_DET_EXTERNAL_GRID -DHW_TEST_TARGET=\"mkrzero-samd21-det\"
monitor_speed = 115200
