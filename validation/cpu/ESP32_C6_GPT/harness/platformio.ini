[env:esp32c6_gpt]
; The registry espressif32 platform's Arduino core (2.x) has no ESP32-C6
; support; the maintained pioarduino fork ships Arduino core 3.x which does.
; Same pinned release artifact as the astro-nav-int ESP32_C6 target.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
; ARDUINO_USB_CDC_ON_BOOT=0 pins Serial to UART0 (the CH343 bridge port,
; 1A86:55D3) — capture there, not on the native 303A:1001 CDC.
; -fwrapv matches the repo Makefile (defined signed wraparound).
; MGPT_NO_TRAIN  — inference-only: no dataset array, no gradients, no Adam.
; MGPT_NO_MAIN   — drop microgpt_int.c's main; src/main.cpp drives the
;                  model via mgpt_load_mem() + mgpt_generate_sample().
; The .mgw weight image is baked in by prepare.sh (model_mgw.h); on ESP32
; const data lives in the flash-mapped rodata segment, read through the
; cache — the weights never occupy RAM.
build_flags = -O2 -fwrapv -Wno-unused-function -DMGPT_NO_TRAIN -DMGPT_NO_MAIN -DHW_TEST_TARGET=\"esp32-c6-gpt\" -DARDUINO_USB_CDC_ON_BOOT=0
monitor_speed = 115200
