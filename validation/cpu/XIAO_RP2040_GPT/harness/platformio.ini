[env:xiao_rp2040_gpt]
; Same pinned maxgerhardt platform commit (arduino-pico core) as the
; astro-nav-int RP2040 targets.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#aa70b802be8851668053d4f09734e4089fe41932
board = seeed_xiao_rp2040
framework = arduino
; -fwrapv matches the repo Makefile (defined signed wraparound).
; MGPT_NO_TRAIN  — inference-only: no dataset array, no gradients, no Adam.
; MGPT_NO_MAIN   — drop microgpt_int.c's main; src/main.cpp drives the
;                  model via mgpt_load_mem() + mgpt_generate_sample().
; The .mgw weight image is baked into flash by prepare.sh (model_mgw.h)
; and read zero-copy through XIP — the weights never occupy RAM.
build_flags = -O2 -fwrapv -Wno-unused-function -DMGPT_NO_TRAIN -DMGPT_NO_MAIN -DHW_TEST_TARGET=\"xiao-rp2040-gpt\"
monitor_speed = 115200
