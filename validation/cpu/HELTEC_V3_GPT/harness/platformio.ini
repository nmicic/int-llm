[env:heltec_v3_gpt]
; Same pinned pioarduino release as the ESP32_C6 targets (Arduino core 3.x).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = heltec_wifi_lora_32_V3
framework = arduino
; The Heltec V3's USB-C is wired through a CP2102 UART bridge (10C4:EA60) to
; UART0 — the S3's native USB is not on the connector — so Serial stays on
; UART0 explicitly (ARDUINO_USB_CDC_ON_BOOT=0), same reasoning as ESP32_C6.
; MGPT_NO_TRAIN  — inference-only: no dataset array, no gradients, no Adam.
; MGPT_NO_MAIN   — drop microgpt_int.c's main; src/main.cpp drives the
;                  model via mgpt_load_mem() + mgpt_generate_sample().
; The .mgw weight image is baked into flash-mapped rodata by prepare.sh
; (model_mgw.h) and read zero-copy — the weights never occupy RAM.
build_flags = -O2 -fwrapv -Wno-unused-function -DMGPT_NO_TRAIN -DMGPT_NO_MAIN -DHW_TEST_TARGET=\"heltec-s3-gpt\" -DARDUINO_USB_CDC_ON_BOOT=0
monitor_speed = 115200
