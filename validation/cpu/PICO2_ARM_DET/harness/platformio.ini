[env:pico2_arm_det]
; Registry raspberrypi platform (mbed core) supports only the RP2040 Pico;
; the maxgerhardt fork with the arduino-pico core supports RP2350 in both
; ARM and RISC-V modes. Same pinned commit as the other RP2 targets.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#aa70b802be8851668053d4f09734e4089fe41932
board = rpipico2
framework = arduino
; -fwrapv matches the repo Makefile; FP_DET_NO_MAIN drops fp_determinism.c's
; stdio main — src/main.cpp calls fp_det_compute() directly.
build_flags = -O2 -fwrapv -DFP_DET_NO_MAIN -DHW_TEST_TARGET=\"pico2-arm-det\"
monitor_speed = 115200
